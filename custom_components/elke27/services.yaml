alarm_arm_automatic:
  name: Arm automatic
  description: >-
    Arms Elk E27 areas from automations, such as geofence- or occupancy-based
    arming when everyone leaves. Open (faulted) zones in each targeted area are
    bypassed before arming; zones in other areas are not changed. It cancels
    auto-stay and the exit delay so the area arms immediately. Refusals are
    never retried; if a bypass or the arm is refused, the area is not armed and
    the bypasses it made are undone. If the arm result is unknown (for example
    a timeout), the bypasses are left in place and you are told to check the
    panel. An area that is already armed is left unchanged. Disarming the
    area cancels a running call at once; it sends nothing more and does not
    roll back.
  target:
    entity:
      domain: alarm_control_panel
      integration: elke27
  fields:
    mode:
      name: Arming mode
      description: Arm away or arm home (stay).
      required: true
      selector:
        select:
          options:
            - away
            - home
    code:
      name: Code
      description: Numeric alarm user code used to arm the area.
      required: true
      selector:
        text:

zone_bypass:
  name: Bypass zone
  description: >-
    Bypasses Elk E27 zones so they are ignored while the area is armed, or
    removes the bypass. Disarming an armed area clears all bypasses;
    disarming an area that is already disarmed does not.
  target:
    entity:
      domain: binary_sensor
      integration: elke27
  fields:
    code:
      name: Code
      description: Numeric alarm user code used to bypass the zone.
      required: true
      selector:
        text:
    bypass:
      name: Bypass
      description: Turn on to bypass the zone, off to remove the bypass.
      default: true
      selector:
        boolean:
