alarm_arm_automatic:
  name: Arm automatic
  description: >-
    Arms Elk E27 areas from automations, such as geofence- or occupancy-based
    arming when everyone leaves. The panel bypasses any open (faulted) zones
    and cancels auto-stay and the exit delay.
  target:
    entity:
      domain: alarm_control_panel
      integration: elke27
  fields:
    mode:
      name: Arming mode
      description: Arm away or arm home (stay).
      required: true
      selector:
        select:
          options:
            - away
            - home
    code:
      name: Code
      description: Numeric alarm user code used to arm the area.
      required: true
      selector:
        text:
