name: Lint

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

permissions: {}

jobs:
  ruff:
    name: "Ruff"
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install requirements
        run: python3 -m pip install -r requirements_test.txt

      - name: Lint
        run: python3 -m ruff check .

      - name: Format
        run: python3 -m ruff format . --check

      - name: Mypy
        run: python3 -m mypy custom_components/elke27

  no-raw-passthrough:
    name: "No raw pass-through"
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # elke27's raw API pass-through (decision 34) is for external test tools
      # only and is out of the HA library contract. Fail if the integration uses it.
      - name: Block async_raw_request / enable_raw_passthrough
        run: |
          if grep -rnE "async_raw_request|enable_raw_passthrough|_raw_passthrough" custom_components/; then
            echo "::error::The HA integration must not use the elke27 raw pass-through."
            exit 1
          fi
