name: Tests

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

permissions: {}

jobs:
  pytest:
    name: "Pytest"
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install requirements
        # Home Assistant and the HA test harness from requirements_test.txt, plus
        # the elke27 version pinned in the manifest so the tests run against what
        # users install.
        run: |
          python3 -m pip install -r requirements_test.txt
          python3 -m pip install "$(python3 -c 'import json; print(json.load(open("custom_components/elke27/manifest.json"))["requirements"][0])')"

      - name: Run tests
        run: python3 -m pytest -q -p no:cacheprovider tests
