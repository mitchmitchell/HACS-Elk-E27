# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "daily"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      # Dependabot should not update Home Assistant as that should match the homeassistant key in hacs.json
      - dependency-name: "homeassistant"
      # pytest-homeassistant-custom-component versions after 0.13.308 pin HA 2026.2+ and later need Python 3.14;
      # remove this ignore when the homeassistant pin and CI Python move up
      - dependency-name: "pytest-homeassistant-custom-component"
        versions: [">0.13.308"]
